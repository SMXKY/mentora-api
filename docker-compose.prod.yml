name: mentora-api-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mentora-api:latest
    container_name: mentora_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Points the app's ClamAV client (src/services/media/media.virusScan.ts)
      # at the containerized clamd below instead of a local unix socket.
      # Remove both this override and the clamav service if you'd rather set
      # CLAMAV_ENABLED=false in .env and skip virus scanning entirely.
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    # Lets the container resolve "host.docker.internal" to the VPS itself.
    # Only matters if DATABASE_URL / REDIS_URL point at "localhost" or
    # "127.0.0.1" (i.e. Postgres/Redis run natively on this same VPS) — a
    # container's "localhost" is itself, not the host, so in that case you
    # must change those two values in .env to "host.docker.internal" instead.
    # If Postgres/Redis are on a different host or a managed service, leave
    # .env exactly as it is — this line is then simply unused.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - clamav
      - livekit
      - redis
      - meilisearch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Virus scanning backend for uploaded media. First boot downloads the virus
  # database (freshclam) and can take a couple of minutes; budget ~1-2GB RAM
  # once the database is loaded — drop this service on a memory-constrained
  # VPS and set CLAMAV_ENABLED=false in .env instead.
  clamav:
    image: clamav/clamav:stable
    container_name: mentora_clamav
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 3m
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: mentora_livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./docker/livekit/livekit.prod.yaml:/etc/livekit.yaml:ro
      # TURN's cert_file/key_file (see livekit.prod.yaml) point into this —
      # certbot renews in place on the host, LiveKit just needs to be
      # restarted after a renewal to pick up the new cert (see HOSTING.md).
      - /etc/letsencrypt:/etc/letsencrypt:ro
  redis:
    image: redis:7.2-alpine
    container_name: mentora_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

  # Tutor search only (see docs/services/tutor-search.doc.md). Not exposed
  # to the host on purpose, unlike the dev compose file — the app reaches
  # it over the internal Docker network at http://meilisearch:7700
  # (MEILI_HOST in .env), there is no reason for Meilisearch's HTTP API to
  # be reachable from outside this VPS.
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: mentora_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set, no default key allowed}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    expose:
      - "7700"
    volumes:
      - meili_data:/meili_data
    # No healthcheck: the official Meilisearch image is a minimal build and
    # I could not confirm wget/curl are actually present in it without
    # running the container, which this environment can't do. Add one back
    # once that's verified against the real image rather than guessed.

volumes:
  clamav_data:
  redis_data:
  meili_data:
