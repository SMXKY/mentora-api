# Self-hosted LiveKit server config for LOCAL DEV ONLY (docker-compose.yml).
# Production uses docker/livekit/livekit.prod.yaml instead (docker-compose.prod.yml)
# — that file adds TURN over TLS and keeps use_external_ip: true, which is
# only correct for a server with a real public IP that clients reach over
# the internet. Keep the two files' shared settings (rtc port range, room,
# keys structure) in sync by hand — LiveKit's config has no templating.

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # false for local dev: true here would advertise this machine's public IP
  # as the ICE candidate even for same-machine/same-LAN testing, which then
  # fails to connect (NAT hairpinning — most routers won't loop outbound
  # traffic back to the same machine that sent it). Confirmed by reproducing
  # this exact failure and fixing it. Production's livekit.prod.yaml
  # correctly keeps this true, since it has a real public IP clients
  # actually connect to over the internet.
  use_external_ip: false

# Rooms are ONLY ever created by the backend's RoomServiceClient (the
# scheduled 15-minutes-before-start job) — never implicitly by a client
# connecting with a token. This is what makes room names non-guessable in
# practice: a token alone can't summon a room into existence.
room:
  auto_create: false
  empty_timeout: 1800 # 30 min — matches REQ-014 empty-room auto-close
  departure_timeout: 900 # 15 min — matches REQ-014 departure timeout

keys:
  LKAPI3edf5ed959038b9a1b2b: Kd8SWWybRNsJTu5gxgB38qe072NGxCfk4SjBXNA

webhook:
  api_key: LKAPI3edf5ed959038b9a1b2b
  urls:
    - http://host.docker.internal:8080/api/v1/webhooks/livekit

logging:
  level: info
